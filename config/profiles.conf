# Battery Optimizer — profile values (single source of truth)
#
# Rendered into /etc/tlp.d/50-battery-optimizer.conf (TLP_* / CPU_* / ... keys)
# and /etc/battery-optimizer/hook.conf (HOOK_* keys).
#
# This file is parsed as KEY=VALUE against an allow-list; it is never sourced.
#
# GNOME menu  -> TLP profile -> suffix
#   Performance -> performance -> _ON_AC
#   Balanced    -> balanced    -> _ON_BAT
#   Power Saver -> power-saver -> _ON_SAV
#
# Note: TLP 1.9 only has _ON_SAV variants for CPU_*, PLATFORM_PROFILE and
# AMDGPU_ABM_LEVEL. Every other per-profile setting (PCIe ASPM, Wi-Fi, runtime
# PM, Intel GPU frequency, ...) uses its _ON_BAT value in Power Saver too.
# Power-Saver-only extras are applied by the hook (HOOK_* keys below).

# --- Platform profile (firmware) --------------------------------------------
# Values missing from /sys/firmware/acpi/platform_profile_choices are mapped
# to the closest available choice at install time.
PLATFORM_PROFILE_ON_AC=performance
PLATFORM_PROFILE_ON_BAT=balanced
PLATFORM_PROFILE_ON_SAV=low-power

# --- CPU ----------------------------------------------------------------------
# EPP is only used by TLP when no platform profile is available.
CPU_ENERGY_PERF_POLICY_ON_AC=balance_performance
CPU_ENERGY_PERF_POLICY_ON_BAT=balance_power
CPU_ENERGY_PERF_POLICY_ON_SAV=power

CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=1
CPU_BOOST_ON_SAV=0

CPU_HWP_DYN_BOOST_ON_AC=1
CPU_HWP_DYN_BOOST_ON_BAT=0
CPU_HWP_DYN_BOOST_ON_SAV=0

CPU_MIN_PERF_ON_AC=0
CPU_MIN_PERF_ON_BAT=0
CPU_MIN_PERF_ON_SAV=0
CPU_MAX_PERF_ON_AC=100
CPU_MAX_PERF_ON_BAT=80
CPU_MAX_PERF_ON_SAV=35

# --- PCIe ASPM policy (shared by Balanced and Power Saver) --------------------
# A *policy*, not pcie_aspm=force: links stay in the states firmware allows.
PCIE_ASPM_ON_AC=default
PCIE_ASPM_ON_BAT=powersupersave

# --- Wi-Fi power saving (shared by Balanced and Power Saver) ------------------
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on

# --- PCI runtime power management ---------------------------------------------
# dGPU drivers are deny-listed so the GPU driver itself (NVIDIA dynamic power
# management / amdgpu runtime PM) decides when the dGPU powers off — also on AC.
RUNTIME_PM_ON_AC=on
RUNTIME_PM_ON_BAT=auto
RUNTIME_PM_DRIVER_DENYLIST="mei_me nouveau nvidia amdgpu radeon xhci_hcd"

# --- Audio --------------------------------------------------------------------
SOUND_POWER_SAVE_ON_AC=0
SOUND_POWER_SAVE_ON_BAT=1

# --- USB ----------------------------------------------------------------------
# Detected HID receivers (Logitech Unifying/Bolt, ...) are appended at install.
USB_AUTOSUSPEND=1
USB_DENYLIST=""

# --- Charge thresholds (overridable with: install --charge START:STOP) --------
CHARGE_START=40
CHARGE_STOP=80

# --- Suspend ------------------------------------------------------------------
# Applied only if /sys/power/mem_sleep lists the value; otherwise left alone.
MEM_SLEEP_ON_AC=deep
MEM_SLEEP_ON_BAT=deep

# --- Hook: Power-Saver-only extras --------------------------------------------
# Internal panel brightness cap in percent (0 = off).
HOOK_BRIGHTNESS_CAP_PCT=40
# Docker while Power Saver is active: stop | warn | ignore
HOOK_DOCKER=stop
# Intel iGPU (i915) max/boost frequency in Power Saver, as percent of the
# range between the hardware minimum (RPn) and maximum (RP0). 100 = no cap.
HOOK_IGPU_MAX_PCT=30

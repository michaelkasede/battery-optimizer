# Installed by battery-optimizer 1.2.0 — removed by: battery-optimizer uninstall
# NVIDIA dGPU: proprietary driver only, video memory preserved across suspend
# (needs nvidia-suspend/resume/hibernate.service) in an on-disk temp path.
blacklist nouveau
options nouveau modeset=0
options nvidia NVreg_PreserveVideoMemoryAllocations=1
options nvidia NVreg_TemporaryFilePath=/var/tmp
# Turing or newer: fine-grained runtime D3 (dGPU off when idle)
options nvidia NVreg_DynamicPowerManagement=0x02

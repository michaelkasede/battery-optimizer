# Installed by battery-optimizer 1.2.0 — removed by: battery-optimizer uninstall
# Generated from config/profiles.conf; edits are overwritten on reinstall.
#
# GNOME Power Mode -> TLP profile -> suffix:
#   Performance -> performance -> _ON_AC
#   Balanced    -> balanced    -> _ON_BAT
#   Power Saver -> power-saver -> _ON_SAV (falls back to _ON_BAT where TLP
#                                          has no _ON_SAV variant)

# 0 = never switch, 1 = Performance on AC / Balanced on battery,
# 2 = smart (keep a manually chosen profile across plug/unplug)
TLP_AUTO_SWITCH=1
TLP_DEFAULT_MODE=BAL
TLP_PERSISTENT_DEFAULT=0

PLATFORM_PROFILE_ON_AC=performance
PLATFORM_PROFILE_ON_BAT=balanced
PLATFORM_PROFILE_ON_SAV=quiet
CPU_ENERGY_PERF_POLICY_ON_AC=balance_performance
CPU_ENERGY_PERF_POLICY_ON_BAT=balance_power
CPU_ENERGY_PERF_POLICY_ON_SAV=power
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=1
CPU_BOOST_ON_SAV=0
CPU_HWP_DYN_BOOST_ON_AC=1
CPU_HWP_DYN_BOOST_ON_BAT=0
CPU_HWP_DYN_BOOST_ON_SAV=0
CPU_MIN_PERF_ON_AC=0
CPU_MIN_PERF_ON_BAT=0
CPU_MIN_PERF_ON_SAV=0
CPU_MAX_PERF_ON_AC=100
CPU_MAX_PERF_ON_BAT=80
CPU_MAX_PERF_ON_SAV=35
PCIE_ASPM_ON_AC=default
PCIE_ASPM_ON_BAT=powersupersave
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on
RUNTIME_PM_ON_AC=on
RUNTIME_PM_ON_BAT=auto
RUNTIME_PM_DRIVER_DENYLIST="mei_me nouveau nvidia amdgpu radeon xhci_hcd"
SOUND_POWER_SAVE_ON_AC=0
SOUND_POWER_SAVE_ON_BAT=1
USB_AUTOSUSPEND=1
USB_DENYLIST=""

# Battery care: charge thresholds
STOP_CHARGE_THRESH_BAT1=80
